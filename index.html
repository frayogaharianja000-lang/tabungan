<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tabungan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #d1d5db;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h3 {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
        }

        .green {
            color: #16a34a;
        }

        .red {
            color: #dc2626;
        }

        .blue {
            color: #2563eb;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .box h2 {
            margin-bottom: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .progress-container {
            background: #e5e7eb;
            height: 20px;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: 0.4s;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            color: #6b7280;
            font-size: 14px;
        }

        .income {
            color: #16a34a;
            font-weight: bold;
        }

        .expense {
            color: #dc2626;
            font-weight: bold;
        }

        .delete-btn {
            background: #ef4444;
            padding: 7px 10px;
            width: auto;
            margin: 0;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        @media(max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💰 Dashboard Tabungan</h1>
        <p>Kelola tabungan dan pantau target keuangan Anda.</p>
    </div>

    <!-- KARTU STATISTIK -->
    <div class="cards">

        <div class="card">
            <h3>Total Tabungan</h3>
            <div class="amount green" id="totalSavings">
                Rp 0
            </div>
        </div>

        <div class="card">
            <h3>Total Pemasukan</h3>
            <div class="amount blue" id="totalIncome">
                Rp 0
            </div>
        </div>

        <div class="card">
            <h3>Total Pengeluaran</h3>
            <div class="amount red" id="totalExpense">
                Rp 0
            </div>
        </div>

    </div>

    <div class="content">

        <!-- KOLOM KIRI -->
        <div>

            <!-- TARGET -->
            <div class="box">
                <h2>🎯 Target Tabungan</h2>

                <input
                    type="number"
                    id="targetInput"
                    placeholder="Masukkan target tabungan"
                >

                <button onclick="setTarget()">
                    Simpan Target
                </button>

                <div class="progress-text">
                    <span>Progress</span>
                    <span id="percentage">0%</span>
                </div>

                <div class="progress-container">
                    <div class="progress" id="progressBar"></div>
                </div>

                <p>
                    Target:
                    <strong id="targetDisplay">Rp 0</strong>
                </p>
            </div>

            <!-- TRANSAKSI -->
            <div class="box">
                <h2>➕ Tambah Transaksi</h2>

                <input
                    type="text"
                    id="description"
                    placeholder="Keterangan"
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Jumlah"
                >

                <select id="type">
                    <option value="income">
                        Pemasukan / Menabung
                    </option>

                    <option value="expense">
                        Pengeluaran
                    </option>
                </select>

                <button onclick="addTransaction()">
                    Tambah Transaksi
                </button>
            </div>

        </div>

        <!-- KOLOM KANAN -->
        <div class="box">

            <h2>📋 Riwayat Transaksi</h2>

            <table>

                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Keterangan</th>
                        <th>Jenis</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="transactionList"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

    let transactions =
        JSON.parse(localStorage.getItem("transactions")) || [];

    let target =
        Number(localStorage.getItem("target")) || 0;


    function formatRupiah(number) {

        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(number);

    }


    function setTarget() {

        const value =
            Number(document.getElementById("targetInput").value);

        if (value <= 0) {
            alert("Masukkan target yang benar.");
            return;
        }

        target = value;

        localStorage.setItem("target", target);

        document.getElementById("targetInput").value = "";

        updateDashboard();

    }


    function addTransaction() {

        const description =
            document.getElementById("description").value;

        const amount =
            Number(document.getElementById("amount").value);

        const type =
            document.getElementById("type").value;


        if (!description || amount <= 0) {
            alert("Lengkapi data transaksi.");
            return;
        }


        const transaction = {

            id: Date.now(),

            date: new Date().toLocaleDateString("id-ID"),

            description: description,

            amount: amount,

            type: type

        };


        transactions.push(transaction);

        localStorage.setItem(
            "transactions",
            JSON.stringify(transactions)
        );


        document.getElementById("description").value = "";

        document.getElementById("amount").value = "";


        updateDashboard();

    }


    function deleteTransaction(id) {

        transactions =
            transactions.filter(
                transaction => transaction.id !== id
            );

        localStorage.setItem(
            "transactions",
            JSON.stringify(transactions)
        );

        updateDashboard();

    }


    function updateDashboard() {

        let income = 0;

        let expense = 0;


        transactions.forEach(transaction => {

            if (transaction.type === "income") {

                income += transaction.amount;

            } else {

                expense += transaction.amount;

            }

        });


        const savings = income - expense;


        document.getElementById("totalIncome")
            .innerText = formatRupiah(income);

        document.getElementById("totalExpense")
            .innerText = formatRupiah(expense);

        document.getElementById("totalSavings")
            .innerText = formatRupiah(savings);

        document.getElementById("targetDisplay")
            .innerText = formatRupiah(target);


        let percentage = 0;

        if (target > 0) {

            percentage =
                Math.min((savings / target) * 100, 100);

        }


        document.getElementById("percentage")
            .innerText = percentage.toFixed(1) + "%";

        document.getElementById("progressBar")
            .style.width = percentage + "%";


        renderTransactions();

    }


    function renderTransactions() {

        const list =
            document.getElementById("transactionList");

        list.innerHTML = "";


        if (transactions.length === 0) {

            list.innerHTML = `
                <tr>
                    <td colspan="5"
                        style="text-align:center;">
                        Belum ada transaksi
                    </td>
                </tr>
            `;

            return;
        }


        transactions
            .slice()
            .reverse()
            .forEach(transaction => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${transaction.date}
                    </td>

                    <td>
                        ${transaction.description}
                    </td>

                    <td class="${
                        transaction.type === "income"
                        ? "income"
                        : "expense"
                    }">

                        ${
                            transaction.type === "income"
                            ? "Pemasukan"
                            : "Pengeluaran"
                        }

                    </td>

                    <td class="${
                        transaction.type === "income"
                        ? "income"
                        : "expense"
                    }">

                        ${
                            transaction.type === "income"
                            ? "+"
                            : "-"
                        }

                        ${formatRupiah(transaction.amount)}

                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteTransaction(${transaction.id})">

                            Hapus

                        </button>

                    </td>

                `;


                list.appendChild(row);

            });

    }


    updateDashboard();

</script>

</body>
</html>
```
